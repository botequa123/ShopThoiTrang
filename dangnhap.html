<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Đăng nhập Đì Văn Or</title>
    <link
      href="https://fonts.googleapis.com/css?family=Karla:400,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.materialdesignicons.com/4.8.95/css/materialdesignicons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
  <body>
    <main>
      <div class="container-fluid">
        <div class="row">
          <div class="col-sm-6 login-section-wrapper">
            <div class="brand-wrapper">
              <a class = class="navbar-brand d-flex align-items-center order-lg-0" href = "index.html" style="font-size: 1.5rem; font-weight: bold; color: black; margin-right: 1rem; font-family: 'Segoe UI', sans-serif; text-transform: uppercase;">
                <img src = "images/shopping-bag-icon.png" alt = "site icon">
                <span class = "text-uppercase fw-lighter ms-2">ĐÌ VĂN OR</span>
            </a>
            </div>
            <div class="login-wrapper my-auto">
              <h1 class="login-title">Đăng nhập</h1>
              <form action="#!">
                <div class="form-group">
                  <label for="email">Tài khoản</label>
                  <input
                    type="username"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Nhập tài khoản"
                  />
                </div>
                <div class="form-group mb-4">
                  <label for="password">Mật khẩu</label>
                  <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Nhập mật khẩu"
                  />
                </div>
                <input
                  name="login"
                  id="login"
                  class="btn btn-block login-btn"
                  type="button"
                  value="Đăng nhập"
                />
              </form>
              <a href="#!" class="forgot-password-link">Quên mật khẩu?</a>
              <p class="login-wrapper-footer-text">
                Bạn chưa có tài khoản ?
                <a href="dangki.html" class="text-reset">Đăng kí</a>
              </p>
            </div>
          </div>
          <div class="col-sm-6 px-0 d-none d-sm-block">
            <img
              src="assets/images/login.jpg"
              alt="login image"
              class="login-img"
            />
          </div>
        </div>
      </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  </body>
</html>
